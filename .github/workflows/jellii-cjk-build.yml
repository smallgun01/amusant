name: Jellii CJK host and StickS3 firmware build

on:
  pull_request:
    paths:
      - ".github/workflows/jellii-cjk-build.yml"
      - "patches/kai-v0.12.0-cjk-display/**"
      - "patches/kai-v0.12.0-jellii/**"
      - "patches/kai-v0.12.0-wifi-w1/**"

permissions:
  contents: read

jobs:
  cjk-patch-and-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out Amusant
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned Kai and apply the three downstream patches
        env:
          KAI_REVISION: 1681fb3c11acd28525d8987bba4b9bf4bc2a288f
        run: |
          git clone --no-tags https://github.com/zbruceli/kai.git kai
          git -C kai checkout --detach "$KAI_REVISION"
          for patch in \
            "patches/kai-v0.12.0-jellii/kai-v0.12.0-jellii.patch" \
            "patches/kai-v0.12.0-wifi-w1/kai-v0.12.0-wifi-w1.patch" \
            "patches/kai-v0.12.0-cjk-display/kai-v0.12.0-cjk-display.patch"; do
            git -C kai apply --check "$GITHUB_WORKSPACE/$patch"
            git -C kai apply "$GITHUB_WORKSPACE/$patch"
          done
      - name: Test UTF-8 text layout without M5GFX
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ikai/firmware/src \
            patches/kai-v0.12.0-cjk-display/tests/test_cjk_layout.cpp \
            -o /tmp/jellii-cjk-test
          /tmp/jellii-cjk-test
      - name: Install PlatformIO
        run: |
          python3 -m venv /tmp/pioenv
          /tmp/pioenv/bin/pip install --disable-pip-version-check "platformio==6.1.18"
      - name: Build Jellii + W1 + CJK (no device / no credentials)
        run: |
          cp kai/firmware/src/secrets.example.h kai/firmware/src/secrets.h
          /tmp/pioenv/bin/pio run -d kai/firmware -e sticks3
          image_bytes=$(stat -c %s kai/firmware/.pio/build/sticks3/firmware.bin)
          echo "CJK firmware binary: $image_bytes bytes / 3342336 byte app partition"
          test "$image_bytes" -le 3342336
