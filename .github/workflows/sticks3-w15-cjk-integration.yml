name: StickS3 W1.5 BLE + production CJK + W2b-1

on:
  pull_request:
    paths:
      - ".github/workflows/sticks3-w15-cjk-integration.yml"
      - "patches/sticks3-w15-cjk/**"
      - "patches/kai-v0.12.0-jellii/**"
      - "patches/kai-v0.12.0-wifi-w1/**"
      - "patches/kai-v0.12.0-wifi-w1.5/**"
      - "patches/kai-v0.12.0-cjk-display/**"
      - "patches/kai-v0.12.0-wifi-w2b1/**"

permissions:
  contents: read

jobs:
  integrate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recreate frozen downstream firmware, integrate CJK
        env:
          KAI_REVISION: 1681fb3c11acd28525d8987bba4b9bf4bc2a288f
        run: |
          git clone --no-tags https://github.com/zbruceli/kai.git kai
          git -C kai checkout --detach "$KAI_REVISION"
          for p in \
            kai-v0.12.0-jellii/kai-v0.12.0-jellii.patch \
            kai-v0.12.0-wifi-w1/kai-v0.12.0-wifi-w1.patch \
            kai-v0.12.0-wifi-w1.5/kai-v0.12.0-wifi-w1.5.patch; do
            git -C kai apply --check "$GITHUB_WORKSPACE/patches/$p"
            git -C kai apply "$GITHUB_WORKSPACE/patches/$p"
          done
          python3 patches/sticks3-w15-cjk/apply_integration.py --kai kai
      - name: Apply configured Wi-Fi W2b-1 layer
        run: |
          git -C kai apply --check "$GITHUB_WORKSPACE/patches/kai-v0.12.0-wifi-w2b1/kai-v0.12.0-wifi-w2b1.patch"
          git -C kai apply "$GITHUB_WORKSPACE/patches/kai-v0.12.0-wifi-w2b1/kai-v0.12.0-wifi-w2b1.patch"
          git -C kai diff --check -- \
            firmware/src/main.cpp firmware/src/wifi_ble_flow.cpp firmware/src/wifi_ble_flow.h \
            firmware/src/wifi_ble_provisioning.cpp firmware/src/wifi_ble_provisioning.h \
            firmware/src/wifi_setup_intent.h firmware/src/wifi_provisioning_commit_gate.h
      - name: Firmware C++ and Python host tests
        run: |
          python3 patches/kai-v0.12.0-wifi-w1.5/tests/run_host_tests.py --firmware-root kai/firmware
          python3 patches/kai-v0.12.0-wifi-w1/tests/run_host_tests.py --firmware-root kai/firmware
          python3 patches/kai-v0.12.0-wifi-w2b1/tests/run_host_tests.py \
            --firmware-root kai/firmware \
            --wifi-tests patches/kai-v0.12.0-wifi-w1.5/tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ikai/firmware/src \
            patches/kai-v0.12.0-cjk-display/tests/test_cjk_layout.cpp \
            -o /tmp/jellii-cjk-test
          /tmp/jellii-cjk-test
      - name: Install PlatformIO
        run: |
          python3 -m venv /tmp/pioenv
          /tmp/pioenv/bin/pip install --disable-pip-version-check "platformio==6.2.0"
      - name: Build production StickS3 firmware with placeholder secrets ONLY
        run: |
          cp kai/firmware/src/secrets.example.h kai/firmware/src/secrets.h
          /tmp/pioenv/bin/pio run -d kai/firmware -e sticks3
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_root = Path.home() / ".platformio/packages"
          core_sources = list(package_root.glob(
              "framework-arduinoespressif32*/libraries/WiFi/src/WiFiGeneric.cpp"
          ))
          if len(core_sources) != 1:
              raise SystemExit(f"Expected one pinned Arduino Wi-Fi core source, found {len(core_sources)}.")
          core = core_sources[0]
          package = json.loads((core.parents[3] / "package.json").read_text(encoding="utf-8"))
          if package.get("version") != "3.3.12":
              raise SystemExit(f"Expected Arduino-ESP32 3.3.12, found {package.get('version')!r}.")
          source = core.read_text(encoding="utf-8")
          required = (
              "esp_event_handler_instance_register(NETWORK_PROV_EVENT",
              "event_id == NETWORK_PROV_END",
              "network_prov_mgr_deinit();",
          )
          if not all(token in source for token in required):
              raise SystemExit("Pinned Arduino core is missing its NETWORK_PROV_END deinit handler.")

          build = Path("kai/firmware/.pio/build/sticks3")
          roots = [build, *package_root.glob("framework-arduinoespressif32*"),
                   *package_root.glob("framework-espidf*")]
          sdkconfigs = [p for root in roots if root.exists() for p in root.rglob("sdkconfig.h")]
          config_files = [p for root in roots if root.exists() for p in root.rglob("sdkconfig")
                          if p.is_file() and p.stat().st_size < 2_000_000]
          active = False
          evidence = []
          for path in [*sdkconfigs, *config_files]:
              for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                  if "CONFIG_NETWORK_PROV_NETWORK_TYPE_WIFI" in line:
                      evidence.append(f"{path}: {line.strip()}")
                      if line.strip() in ("#define CONFIG_NETWORK_PROV_NETWORK_TYPE_WIFI 1",
                                          "CONFIG_NETWORK_PROV_NETWORK_TYPE_WIFI=y"):
                          active = True
          print("NETWORK_PROV_NETWORK_TYPE_WIFI config evidence:")
          for item in evidence:
              print(item)
          if not active:
              raise SystemExit("Pinned sticks3 build did not expose an enabled NETWORK_PROV_NETWORK_TYPE_WIFI setting.")
          print("Pinned Arduino-ESP32 3.3.12 source and sticks3 config enable core-owned END deinit.")
          PY
          image_bytes=$(stat -c %s kai/firmware/.pio/build/sticks3/firmware.bin)
          echo "Production W1.5 + CJK + W2b-1 firmware binary: $image_bytes / 3342336 bytes"
          test "$image_bytes" -le 3342336
          python3 - <<'PY'
          from pathlib import Path

          root = Path("kai/firmware")
          for relative in ("platformio.ini", "src/main.cpp", "src/wifi_console.cpp", "src/face.cpp"):
              source = (root / relative).read_text(encoding="utf-8")
              if "JELLII_CJK_DIAGNOSTICS" in source or "CJK SHOW" in source:
                  raise SystemExit(f"production source unexpectedly contains opt-in CJK diagnostics: {relative}")
          image = (root / ".pio/build/sticks3/firmware.bin").read_bytes()
          forbidden = (b"CJK SHOW", b"CJK MISSING", b"CJK FORMAT", b"CJK NONBMP", b"CJK INVALID")
          present = [marker.decode("ascii") for marker in forbidden if marker in image]
          if present:
              raise SystemExit("production firmware exposes opt-in CJK diagnostics: " + ", ".join(present))
          print("Production sticks3 excludes JELLII_CJK_DIAGNOSTICS and CJK Serial diagnostics.")
          PY
      - name: Check exact pinned glyph data and production wrap widths
        run: |
          python3 patches/kai-v0.12.0-cjk-display/tests/check_efont_tw.py \
            --m5gfx kai/firmware/.pio/libdeps/sticks3/M5GFX@0.2.30 \
            --emit-header /tmp/jellii_cjk_font_metrics.generated.hpp
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Ikai/firmware/src -I/tmp \
            patches/kai-v0.12.0-cjk-display/tests/test_cjk_font_width.cpp \
            -o /tmp/jellii-cjk-font-test
          /tmp/jellii-cjk-font-test
          rm kai/firmware/src/secrets.h
