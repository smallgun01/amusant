name: StickS3 W1.5 BLE + CJK integration

on:
  pull_request:
    paths:
      - ".github/workflows/sticks3-w15-cjk-integration.yml"
      - "patches/sticks3-w15-cjk/**"
      - "patches/kai-v0.12.0-jellii/**"
      - "patches/kai-v0.12.0-wifi-w1/**"
      - "patches/kai-v0.12.0-wifi-w1.5/**"
      - "patches/kai-v0.12.0-cjk-display/**"

permissions:
  contents: read

jobs:
  integrate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recreate frozen downstream firmware, integrate CJK
        env:
          KAI_REVISION: 1681fb3c11acd28525d8987bba4b9bf4bc2a288f
        run: |
          git clone --no-tags https://github.com/zbruceli/kai.git kai
          git -C kai checkout --detach "$KAI_REVISION"
          for p in \
            kai-v0.12.0-jellii/kai-v0.12.0-jellii.patch \
            kai-v0.12.0-wifi-w1/kai-v0.12.0-wifi-w1.patch \
            kai-v0.12.0-wifi-w1.5/kai-v0.12.0-wifi-w1.5.patch; do
            git -C kai apply --check "$GITHUB_WORKSPACE/patches/$p"
            git -C kai apply "$GITHUB_WORKSPACE/patches/$p"
          done
          python3 patches/sticks3-w15-cjk/apply_integration.py --kai kai
      - name: Firmware C++ and Python host tests
        run: |
          python3 patches/kai-v0.12.0-wifi-w1.5/tests/run_host_tests.py --firmware-root kai/firmware
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ikai/firmware/src \
            patches/kai-v0.12.0-cjk-display/tests/test_cjk_layout.cpp \
            -o /tmp/jellii-cjk-test
          /tmp/jellii-cjk-test
      - name: Install PlatformIO
        run: |
          python3 -m venv /tmp/pioenv
          /tmp/pioenv/bin/pip install --disable-pip-version-check "platformio==6.2.0"
      - name: Build combined StickS3 firmware with placeholder secrets ONLY
        run: |
          cp kai/firmware/src/secrets.example.h kai/firmware/src/secrets.h
          /tmp/pioenv/bin/pio run -d kai/firmware -e sticks3
          image_bytes=$(stat -c %s kai/firmware/.pio/build/sticks3/firmware.bin)
          echo "W1.5 + CJK firmware binary: $image_bytes / 3342336 bytes"
          test "$image_bytes" -le 3342336
          rm kai/firmware/src/secrets.h
