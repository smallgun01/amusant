name: CI

# Offline-only regression checks. Never use pull_request_target or inject real
# Gemini, AWS, device PSK, or Bearer credentials into these jobs.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo heavy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo heavy=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)patches/amusant-sticks3-base-v0.12.0.patch'
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)
          # The CI workflow may accompany this candidate only; unrelated CI
          # edits retain the ordinary heavy checks.
          if printf '%s\n' "$changed" | grep -qx '.github/workflows/ci.yml' &&
             ! printf '%s\n' "$changed" | grep -q '^patches/amusant-sticks3-base-v0.12.0.patch$'; then
            echo heavy=true >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -Ev '^$|\.(md|mdx)$|^patches/|^\.github/workflows/(ci|sticks3-candidate)\.yml$' >/dev/null; then
            echo heavy=true >> "$GITHUB_OUTPUT"
          else
            echo heavy=false >> "$GITHUB_OUTPUT"
          fi

  docs-only-check:
    name: Lightweight documentation and diff check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^[a-fA-F0-9]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)patches/amusant-sticks3-base-v0.12.0.patch'
          fi

  offline-regression:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Fast Voice / Relay / TLS-PSK (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            spikes/005-grok-bot-validation/uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies (hardware Opus + moto)
        run: uv sync --locked --python 3.13 --extra hardware-opus --group dev

      - name: Grok G2 offline regression (isolated locked dependencies)
        run: |
          uv sync --locked --python 3.13 --project spikes/005-grok-bot-validation
          uv run --locked --python 3.13 --project spikes/005-grok-bot-validation python -m unittest discover -s spikes/005-grok-bot-validation/tests -v

      - name: Fast Voice offline tests
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s fast_voice/tests -v

      - name: Relay offline tests (including moto/DynamoDB)
        # Legacy test_mock_relay imports mock_relay as a top-level module.
        # Preserve repo root for package imports, and relay/ for that import.
        env:
          PYTHONPATH: .:relay
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s relay/tests -v

      - name: OCI offline deployment package guards
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s deploy/oci-a1/tests -v

      - name: TLS-PSK WSS / Opus loopback (fake LiveProvider)
        # Direct script execution adds relay/tests to sys.path, not the repo root.
        env:
          PYTHONPATH: .
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python relay/tests/psk_wss_integration.py

  oci-arm64-images:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: OCI ARM64 Relay, facade and egress-proxy image smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate offline Compose inputs without starting services
        shell: bash
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          python - "$temp_dir" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          values = {
              "RELAY_IMAGE": "registry.invalid/relay@sha256:" + "a" * 64,
              "FACADE_IMAGE": "registry.invalid/facade@sha256:" + "b" * 64,
              "HERMES_IMAGE": "registry.invalid/hermes@sha256:" + "c" * 64,
              "EGRESS_PROXY_IMAGE": "registry.invalid/proxy@sha256:" + "d" * 64,
              "RELAY_API_CIDR": "172.30.62.0/29",
              "RELAY_BIND_IP": "172.30.62.2",
              "FACADE_RELAY_BIND_IP": "172.30.62.3",
              "HERMES_API_CIDR": "172.30.64.0/29",
              "FACADE_HERMES_BIND_IP": "172.30.64.2",
              "HERMES_API_BIND_IP": "172.30.64.3",
              "RELAY_EGRESS_CIDR": "172.30.63.0/29",
              "RELAY_EGRESS_IP": "172.30.63.2",
              "EGRESS_PROXY_RELAY_BIND_IP": "172.30.63.3",
              "HERMES_EGRESS_CIDR": "172.30.65.0/29",
              "HERMES_EGRESS_IP": "172.30.65.2",
              "EGRESS_PROXY_HERMES_BIND_IP": "172.30.65.3",
              "RELAY_HOST_PRIVATE_IP": "10.0.0.10",
              "RELAY_PUBLISH_PORT": "8443",
              "OCI_DATA_DIR": str(root / "data"),
              "HERMES_CONFIG_FILE": str(root / "hermes-config.yaml"),
              "RELAY_CPU_LIMIT": "0.35",
              "FACADE_CPU_LIMIT": "0.10",
              "HERMES_CPU_LIMIT": "0.55",
              "PROXY_CPU_LIMIT": "0.05",
              "RELAY_MEMORY_LIMIT": "1536m",
              "FACADE_MEMORY_LIMIT": "256m",
              "HERMES_MEMORY_LIMIT": "3584m",
              "PROXY_MEMORY_LIMIT": "128m",
              "AMUSANT_CLIENT_ID": "offline-owner",
              "AMUSANT_BACKEND_ID": "offline-backend",
              "AMUSANT_HERMES_RUN_DEADLINE_SECONDS": "60",
              "AMUSANT_HERMES_POLL_CYCLE_SECONDS": "2",
              "AMUSANT_HERMES_HTTP_TIMEOUT_SECONDS": "3",
              "AMUSANT_HERMES_POLL_INTERVAL_SECONDS": "0.05",
              "AMUSANT_HERMES_STOP_GRACE_SECONDS": "30",
              "AMUSANT_HERMES_STOP_MAX_ATTEMPTS": "3",
              "AMUSANT_HERMES_STOP_RETRY_BASE_SECONDS": "0.05",
              "AMUSANT_HERMES_STOP_RETRY_MAX_SECONDS": "0.2",
              "AMUSANT_RELAY_SHUTDOWN_GRACE_SECONDS": "10",
              "RELAY_STOP_GRACE_PERIOD": "90s",
              "FACADE_STOP_GRACE_PERIOD": "10s",
              "HERMES_STOP_GRACE_PERIOD": "30s",
          }
          for name in ("GEMINI_API_KEY_FILE", "DEVICE_TOKEN_FILE", "DEVICE_PSKS_FILE", "FACADE_API_KEY_FILE", "FACADE_WRITER_API_KEY_FILE", "HERMES_API_KEY_FILE"):
              path = root / name.lower()
              path.write_text("offline-only-placeholder\n", encoding="utf-8")
              path.chmod(0o600)
              values[name] = str(path)
          (root / "data" / "relay").mkdir(parents=True)
          (root / "data" / "hermes").mkdir()
          (root / "data" / "results" / "facade").mkdir(parents=True)
          (root / "hermes-config.yaml").write_text("\n".join([
              "plugins:",
              "  enabled:",
              "    - amusant-option-d",
              "platform_toolsets:",
              "  api_server:",
              "    - amusant_option_d",
          ]) + "\n", encoding="utf-8")
          (root / "compose.env").write_text(
              "".join(f"{name}={value}\n" for name, value in values.items()), encoding="utf-8"
          )
          PY
          python deploy/oci-a1/preflight.py --env-file "$temp_dir/compose.env"
          docker compose --env-file "$temp_dir/compose.env" -f deploy/oci-a1/compose.yaml config --quiet

      - name: Build Relay for ARM64 without importing cross-platform cache
        run: docker buildx build --platform linux/arm64 --load -f deploy/oci-a1/Dockerfile.relay -t amusant-relay:oci-arm64-ci .

      - name: Verify Relay source imports as non-root
        run: docker run --rm --platform linux/arm64 --network none --read-only --user 10001:10001 --entrypoint /app/.venv/bin/python amusant-relay:oci-arm64-ci -c 'import relay.live_bridge; print("NONROOT_IMPORT_PASS")'

      - name: Exercise OpenCC on the Relay ARM64 runtime
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /app/.venv/bin/python amusant-relay:oci-arm64-ci -c 'from opencc import OpenCC; assert OpenCC("s2twp.json").convert("没问题，我会回复你的。") == "沒問題，我會回覆你的。"'


      - name: Exercise Relay ARM64 runtime and Opus codec
        run: docker run --rm --platform linux/arm64 --entrypoint /app/.venv/bin/python amusant-relay:oci-arm64-ci -m unittest discover -s relay/tests -p test_device_opus.py -v

      - name: Exercise Relay TLS-PSK runtime support
        run: docker run --rm --platform linux/arm64 --entrypoint /app/.venv/bin/python amusant-relay:oci-arm64-ci -m unittest discover -s relay/tests -p test_device_tls_psk.py -v

      - name: Build facade for ARM64
        run: docker buildx build --platform linux/arm64 --load -f deploy/oci-a1/Dockerfile.facade -t amusant-facade:oci-arm64-ci .

      - name: Build egress proxy for ARM64
        run: docker buildx build --platform linux/arm64 --load -f deploy/oci-a1/Dockerfile.egress-proxy -t amusant-egress-proxy:oci-arm64-ci .

      - name: Build two-UID Facade writer smoke image
        run: docker build --platform linux/amd64 -f deploy/oci-a1/Dockerfile.facade-smoke -t amusant-facade-runtime-smoke .

      - name: Exercise private writer channel across Linux UIDs
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --tmpfs /var/lib/amusant-results:rw,noexec,nosuid,size=16m,uid=10003,gid=10003,mode=700 amusant-facade-runtime-smoke

  result-contract-v2:
    needs: changes
    name: Result Contract v2 regression proof
    if: needs.changes.outputs.heavy == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13 --extra hardware-opus --group dev

      - name: Relay Result Contract v2 validation and executor regressions
        env:
          PYTHONPATH: .:relay
        run: |
          uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s relay/tests -p test_hermes_result.py -v
          uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s relay/tests -p test_hermes_runs_executor.py -v

      - name: Facade, plugin, and integrated E2E v2 contract regressions
        env:
          PYTHONPATH: .:relay
        run: |
          uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s deploy/oci-a1/tests -p test_facade_runtime_contract.py -v
          uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s deploy/oci-a1/tests -p test_result_contract_v2_cutover_precheck.py -v
          uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s deploy/oci-a1/tests -p test_hermes_runs_inventory.py -v
          uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s spikes/004-relay-facade-hermes-e2e -p 'test_*.py' -v
  issue-82-arm64-go-no-go:
    name: Native ARM64 Hermes and Relay offline gates
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'codex/issue-82-arm64-gate')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ARM64_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up native Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run native ARM64 offline go/no-go gate
        run: python3 deploy/oci-a1/arm64_gate.py

      - name: Upload sanitized ARM64 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-82-arm64-gate-${{ github.run_id }}
          path: |
            deploy/oci-a1/evidence/arm64-gate.json
            spikes/004-relay-facade-hermes-e2e/evidence/phase1b-e1.json
          if-no-files-found: warn
          retention-days: 14

  ci-result:
    name: CI result gate
    if: ${{ always() }}
    needs: [changes, docs-only-check, offline-regression, oci-arm64-images, result-contract-v2]
    runs-on: ubuntu-24.04
    env:
      SCOPE: ${{ needs.changes.result }}
      LIGHT: ${{ needs.docs-only-check.result }}
      RUN_HEAVY: ${{ needs.changes.outputs.heavy == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
      REGRESSION: ${{ needs.offline-regression.result }}
      IMAGES: ${{ needs.oci-arm64-images.result }}
      RESULT_V2: ${{ needs.result-contract-v2.result }}
    steps:
      - name: Verify all selected checks passed
        shell: bash
        run: |
          test "$SCOPE" = success && test "$LIGHT" = success
          case "$RUN_HEAVY" in
            true) test "$REGRESSION" = success && test "$IMAGES" = success && test "$RESULT_V2" = success ;;
            false) test "$REGRESSION" = skipped && test "$IMAGES" = skipped && test "$RESULT_V2" = skipped ;;
            *) echo 'Invalid scope result' >&2; exit 1 ;;
          esac
