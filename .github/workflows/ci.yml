name: CI

# Offline-only regression checks. Never use pull_request_target or inject real
# Gemini, AWS, device PSK, or Bearer credentials into these jobs.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Fast Voice / Relay / TLS-PSK (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies (hardware Opus + moto)
        run: uv sync --locked --python 3.13 --extra hardware-opus --group dev

      - name: Fast Voice offline tests
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s fast_voice/tests -v

      - name: Relay offline tests (including moto/DynamoDB)
        # Legacy test_mock_relay imports mock_relay as a top-level module.
        # Preserve repo root for package imports, and relay/ for that import.
        env:
          PYTHONPATH: .:relay
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s relay/tests -v

      - name: OCI offline deployment package guards
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python -m unittest discover -s deploy/oci-a1/tests -v

      - name: TLS-PSK WSS / Opus loopback (fake LiveProvider)
        # Direct script execution adds relay/tests to sys.path, not the repo root.
        env:
          PYTHONPATH: .
        run: uv run --locked --python 3.13 --extra hardware-opus --group dev python relay/tests/psk_wss_integration.py

  oci-arm64-images:
    name: OCI ARM64 Relay and egress-proxy image smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate offline Compose inputs without starting services
        shell: bash
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          python - "$temp_dir" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          values = {
              "RELAY_IMAGE": "registry.invalid/relay@sha256:" + "a" * 64,
              "HERMES_IMAGE": "registry.invalid/hermes@sha256:" + "b" * 64,
              "EGRESS_PROXY_IMAGE": "registry.invalid/proxy@sha256:" + "c" * 64,
              "RELAY_API_CIDR": "172.30.62.0/29",
              "RELAY_BIND_IP": "172.30.62.2",
              "HERMES_API_BIND_IP": "172.30.62.3",
              "CONTROLLED_EGRESS_CIDR": "172.30.63.0/29",
              "HERMES_EGRESS_IP": "172.30.63.2",
              "RELAY_EGRESS_IP": "172.30.63.3",
              "EGRESS_PROXY_BIND_IP": "172.30.63.4",
              "RELAY_HOST_PRIVATE_IP": "10.0.0.10",
              "RELAY_PUBLISH_PORT": "8443",
              "OCI_DATA_DIR": str(root / "data"),
              "RELAY_CPU_LIMIT": "0.35",
              "HERMES_CPU_LIMIT": "0.55",
              "PROXY_CPU_LIMIT": "0.05",
              "RELAY_MEMORY_LIMIT": "1536m",
              "HERMES_MEMORY_LIMIT": "3584m",
              "PROXY_MEMORY_LIMIT": "128m",
              "AMUSANT_CLIENT_ID": "offline-owner",
              "AMUSANT_BACKEND_ID": "offline-backend",
              "AMUSANT_HERMES_RUN_DEADLINE_SECONDS": "60",
              "AMUSANT_HERMES_POLL_CYCLE_SECONDS": "2",
              "AMUSANT_HERMES_HTTP_TIMEOUT_SECONDS": "3",
              "AMUSANT_HERMES_POLL_INTERVAL_SECONDS": "0.05",
              "AMUSANT_HERMES_STOP_GRACE_SECONDS": "30",
              "AMUSANT_HERMES_STOP_MAX_ATTEMPTS": "3",
              "AMUSANT_HERMES_STOP_RETRY_BASE_SECONDS": "0.05",
              "AMUSANT_HERMES_STOP_RETRY_MAX_SECONDS": "0.2",
              "AMUSANT_RELAY_SHUTDOWN_GRACE_SECONDS": "10",
              "RELAY_STOP_GRACE_PERIOD": "90s",
              "HERMES_STOP_GRACE_PERIOD": "30s",
          }
          for name in ("GEMINI_API_KEY_FILE", "DEVICE_TOKEN_FILE", "DEVICE_PSKS_FILE", "HERMES_API_KEY_FILE"):
              path = root / name.lower()
              path.write_text("offline-only-placeholder\n", encoding="utf-8")
              path.chmod(0o600)
              values[name] = str(path)
          (root / "data" / "relay").mkdir(parents=True)
          (root / "data" / "hermes").mkdir()
          (root / "compose.env").write_text(
              "".join(f"{name}={value}\n" for name, value in values.items()), encoding="utf-8"
          )
          PY
          python deploy/oci-a1/preflight.py --env-file "$temp_dir/compose.env"
          docker compose --env-file "$temp_dir/compose.env" -f deploy/oci-a1/compose.yaml config --quiet

      - name: Build Relay for ARM64 without importing cross-platform cache
        run: docker buildx build --platform linux/arm64 --load -f deploy/oci-a1/Dockerfile.relay -t amusant-relay:oci-arm64-ci .

      - name: Exercise Relay ARM64 runtime and Opus codec
        run: docker run --rm --platform linux/arm64 --entrypoint /app/.venv/bin/python amusant-relay:oci-arm64-ci -m unittest discover -s relay/tests -p test_device_opus.py -v

      - name: Exercise Relay TLS-PSK runtime support
        run: docker run --rm --platform linux/arm64 --entrypoint /app/.venv/bin/python amusant-relay:oci-arm64-ci -m unittest discover -s relay/tests -p test_device_tls_psk.py -v

      - name: Build egress proxy for ARM64
        run: docker buildx build --platform linux/arm64 --load -f deploy/oci-a1/Dockerfile.egress-proxy -t amusant-egress-proxy:oci-arm64-ci .

  hermes-offline-recovery:
    name: Hermes Native Runs fake-provider recovery gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Relay and Hermes offline fake-provider E2E
        run: python spikes/002-hermes-native-runs-poc/run_phase2b.py

  issue-79-option-d-recovery:
    name: Pinned Hermes Option D recovery proof
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/issue-73-') || startsWith(github.head_ref, 'codex/issue-79-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker Compose is available
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: Run pinned Hermes Option D proof
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 spikes/003-hermes-option-d-poc/run_poc.py

      - name: Upload sanitized proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-79-option-d-recovery-evidence-${{ github.run_id }}
          path: spikes/003-hermes-option-d-poc/evidence/phase2.json
          if-no-files-found: warn
          retention-days: 14

