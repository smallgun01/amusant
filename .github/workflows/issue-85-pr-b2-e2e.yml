name: Issue #85 PR-B2 E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/oci-a1/**"
      - "fast_voice/**"
      - "relay/**"
      - "spikes/004-relay-facade-hermes-e2e/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/oci-a1/**"
      - "fast_voice/**"
      - "relay/**"
      - "spikes/004-relay-facade-hermes-e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-85-pr-b2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relay-facade-hermes-e2e:
    name: Relay to Facade to Hermes offline E2E (native ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker Compose is available
        continue-on-error: true
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: Check the integrated proof contract
        run: python3 -m unittest discover -s spikes/004-relay-facade-hermes-e2e -p 'test_*.py' -v

      - name: Run offline Relay to Facade to Hermes integration
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 spikes/004-relay-facade-hermes-e2e/run_e2e.py

      - name: Run offline effective toolset preflight (fake provider only)
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 spikes/004-relay-facade-hermes-e2e/run_toolset_preflight.py

      - name: Upload sanitized integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-85-pr-b2-integrated-e2e-${{ github.run_id }}
          path: spikes/004-relay-facade-hermes-e2e/evidence/phase1b-e1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload sanitized effective-toolset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-56-h12-toolset-preflight-${{ github.run_id }}
          path: spikes/004-relay-facade-hermes-e2e/evidence/toolset-preflight.json
          if-no-files-found: warn
          retention-days: 30
