name: Issue 27 G1 private ingress PoC

on:
  push:
    branches:
      - codex/issue-27-g1-ingress
  pull_request:
    paths:
      - deploy/oci-a1/**
      - .github/workflows/issue-27-g1-offline.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: issue-27-g1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-ingress-isolation:
    name: Docker isolation and systemd TCP ingress (synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mark isolated-branch test as running
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "issue-27-g1-private-ingress",
              description: "G1 offline ingress PoC is running",
              target_url: url,
            });

      - name: Check host tools
        run: |
          docker version
          docker compose version
          systemctl show --property=Version --value
          test -x /usr/lib/systemd/systemd-socket-proxyd
          test -d /run/systemd/system

      - name: Run OCI package offline tests
        run: python3 -m unittest discover -s deploy/oci-a1/tests -v

      - name: Run isolated TLS-PSK ingress PoC
        env:
          G1_EVIDENCE_PATH: ${{ runner.temp }}/issue-27-g1-evidence.json
          PYTHONUNBUFFERED: "1"
        run: sudo --preserve-env=G1_EVIDENCE_PATH,PYTHONUNBUFFERED python3 deploy/oci-a1/tests/run_device_ingress_poc.py

      - name: Upload sanitized offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-27-g1-offline-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-27-g1-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish isolated-branch result for CI status checks
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "issue-27-g1-private-ingress",
              description: `G1 offline ingress PoC: ${state}`,
              target_url: url,
            });

