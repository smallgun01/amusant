name: amusant-hermes-runs-h1-v1

x-hermes-image: &hermes-image "${POC_HERMES_IMAGE:?runner must set an immutable Hermes image digest}"
x-hermes-platform: &hermes-platform "${POC_HERMES_PLATFORM:-linux/amd64}"

services:
  seed:
    profiles: ["bootstrap"]
    image: *hermes-image
    platform: *hermes-platform
    user: "10000:10000"
    entrypoint: ["python3", "/poc/seed_config.py"]
    command: []
    environment:
      HERMES_HOME: /opt/data
    volumes:
      - hermes_home:/opt/data
      - ./hermes-config.yaml:/poc/hermes-config.yaml:ro
      - ./seed_config.py:/poc/seed_config.py:ro

  fake-provider:
    image: *hermes-image
    platform: *hermes-platform
    user: "10000:10000"
    entrypoint: ["python3", "/poc/fake_provider.py"]
    command: []
    environment:
      FAKE_CLIENT_DELAY_SECONDS: "4"
      FAKE_RESTART_DELAY_SECONDS: "40"
      FAKE_STOP_DELAY_SECONDS: "40"
    volumes:
      - ./fake_provider.py:/poc/fake_provider.py:ro
    networks:
      - isolated

  hermes:
    image: *hermes-image
    platform: *hermes-platform
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${POC_API_KEY:?run_poc.py must set POC_API_KEY}"
      POC_FAKE_MODEL_KEY: "${POC_FAKE_MODEL_KEY:?run_poc.py must set POC_FAKE_MODEL_KEY}"
    volumes:
      - hermes_home:/opt/data
    depends_on:
      - fake-provider
    stop_grace_period: 3s
    networks:
      - isolated

  client:
    image: *hermes-image
    platform: *hermes-platform
    user: "10000:10000"
    entrypoint: ["python3", "/poc/poc_client.py"]
    command: []
    environment:
      POC_API_BASE: http://hermes:8642
      POC_API_KEY: "${POC_API_KEY:?run_poc.py must set POC_API_KEY}"
      POC_FAKE_BASE: http://fake-provider:8000
    volumes:
      - ./poc_client.py:/poc/poc_client.py:ro
    networks:
      - isolated

  phase2b-state-init:
    image: *hermes-image
    platform: *hermes-platform
    user: "0:0"
    entrypoint: ["python3", "-c"]
    command: ["import os; os.chown('/state', 10000, 10000); os.chmod('/state', 0o700)"]
    volumes:
      - phase2b_state:/state

  phase2b-relay:
    image: *hermes-image
    platform: *hermes-platform
    user: "10000:10000"
    entrypoint: ["python3", "/poc/phase2b_relay_client.py"]
    command: []
    environment:
      POC_API_BASE: http://hermes:8642
      POC_API_KEY: "${POC_API_KEY:?run_poc.py must set POC_API_KEY}"
      POC_FAKE_BASE: http://fake-provider:8000
      AMUSANT_HERMES_RUNS_URL: http://hermes:8642
      AMUSANT_HERMES_API_KEY: "${POC_API_KEY:?run_poc.py must set POC_API_KEY}"
      AMUSANT_HERMES_RUN_DEADLINE_SECONDS: "${POC_RUN_DEADLINE_SECONDS:?run_phase2b.py must set test-only deadline}"
      AMUSANT_HERMES_POLL_CYCLE_SECONDS: "${POC_POLL_CYCLE_SECONDS:?run_phase2b.py must set test-only cycle budget}"
      AMUSANT_HERMES_HTTP_TIMEOUT_SECONDS: "${POC_HTTP_TIMEOUT_SECONDS:?run_phase2b.py must set test-only HTTP timeout}"
      AMUSANT_HERMES_POLL_INTERVAL_SECONDS: "${POC_POLL_INTERVAL_SECONDS:?run_phase2b.py must set test-only poll interval}"
      AMUSANT_HERMES_STOP_GRACE_SECONDS: "${POC_STOP_GRACE_SECONDS:?runner must set test-only stop grace}"
      AMUSANT_HERMES_STOP_MAX_ATTEMPTS: "${POC_STOP_MAX_ATTEMPTS:?runner must set test-only stop attempts}"
      AMUSANT_HERMES_STOP_RETRY_BASE_SECONDS: "${POC_STOP_RETRY_BASE_SECONDS:?runner must set test-only stop retry base}"
      AMUSANT_HERMES_STOP_RETRY_MAX_SECONDS: "${POC_STOP_RETRY_MAX_SECONDS:?runner must set test-only stop retry maximum}"
      AMUSANT_HERMES_ALLOW_PLAINTEXT: "1"
      PYTHONPATH: /repo
      POC_RUN_TAG: "${POC_RUN_TAG:-p2b-unused}"
    volumes:
      - ./phase2b_relay_client.py:/poc/phase2b_relay_client.py:ro
      - ../../relay:/repo/relay:ro
      - phase2b_state:/state
    depends_on:
      - hermes
    networks:
      - isolated

networks:
  isolated:
    internal: true

volumes:
  hermes_home:
    name: ${POC_VOLUME_PREFIX:-amusant-hermes-runs-h1-v1}-home
  phase2b_state:
    name: ${POC_VOLUME_PREFIX:-amusant-hermes-runs-h1-v1}-state
