[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amusant-grok-bot-validation"
version = "0.1.0"
description = "Isolated offline pilot for Grok Bot result delivery"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.10.0,<3",
    "mcp==2.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
grok-pilot = "grok_pilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_pilot"]

[tool.uv]
package = true
