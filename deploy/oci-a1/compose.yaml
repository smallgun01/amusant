name: amusant-oci-a1

services:
  relay:
    image: ${RELAY_IMAGE:?set an immutable Relay image reference}
    platform: linux/arm64
    user: "10001:10001"
    group_add: ["20000"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: ${RELAY_STOP_GRACE_PERIOD:?set longer than the maximum configured execution cycle}
    environment:
      RELAY_DEVICE_MODE: sticks3
      RELAY_BIND_IP: ${RELAY_BIND_IP:?set the static Relay IP on relay_api}
      RELAY_LISTEN_PORT: "8443"
      AMUSANT_LIVE_PROVIDER: gemini
      AMUSANT_CLIENT_ID: ${AMUSANT_CLIENT_ID:?set the authenticated owner id}
      AMUSANT_BACKEND_ID: ${AMUSANT_BACKEND_ID:?set the approved backend id}
      AMUSANT_TASK_STORE: sqlite
      AMUSANT_TASK_DB: /var/lib/amusant/task-ledger.sqlite3
      AMUSANT_SLOW_EXECUTOR: hermes_runs
      AMUSANT_HERMES_RUNS_URL: http://facade:8643
      AMUSANT_HERMES_ALLOW_PLAINTEXT: "1"
      AMUSANT_HERMES_RUN_DEADLINE_SECONDS: ${AMUSANT_HERMES_RUN_DEADLINE_SECONDS:?set an owner-approved Run deadline}
      AMUSANT_HERMES_POLL_CYCLE_SECONDS: ${AMUSANT_HERMES_POLL_CYCLE_SECONDS:?set a product poll-cycle value}
      AMUSANT_HERMES_HTTP_TIMEOUT_SECONDS: ${AMUSANT_HERMES_HTTP_TIMEOUT_SECONDS:?set an HTTP timeout}
      AMUSANT_HERMES_POLL_INTERVAL_SECONDS: ${AMUSANT_HERMES_POLL_INTERVAL_SECONDS:?set a poll interval}
      AMUSANT_HERMES_STOP_GRACE_SECONDS: ${AMUSANT_HERMES_STOP_GRACE_SECONDS:?set a stop grace}
      AMUSANT_HERMES_STOP_MAX_ATTEMPTS: ${AMUSANT_HERMES_STOP_MAX_ATTEMPTS:?set a stop-attempt limit}
      AMUSANT_HERMES_STOP_RETRY_BASE_SECONDS: ${AMUSANT_HERMES_STOP_RETRY_BASE_SECONDS:?set a stop-retry base}
      AMUSANT_HERMES_STOP_RETRY_MAX_SECONDS: ${AMUSANT_HERMES_STOP_RETRY_MAX_SECONDS:?set a stop-retry maximum}
      AMUSANT_RELAY_SHUTDOWN_GRACE_SECONDS: ${AMUSANT_RELAY_SHUTDOWN_GRACE_SECONDS:?set a bounded dispatcher drain grace}
      AMUSANT_TASK_DB_DIR: /var/lib/amusant
      HTTPS_PROXY: http://${EGRESS_PROXY_RELAY_BIND_IP:?set the Relay-side proxy IP}:3128
      HTTP_PROXY: http://${EGRESS_PROXY_RELAY_BIND_IP:?set the Relay-side proxy IP}:3128
      NO_PROXY: ${FACADE_RELAY_BIND_IP:?set the facade Relay-side IP},facade,localhost,127.0.0.1
      https_proxy: http://${EGRESS_PROXY_RELAY_BIND_IP:?}:3128
      http_proxy: http://${EGRESS_PROXY_RELAY_BIND_IP:?}:3128
      wss_proxy: http://${EGRESS_PROXY_RELAY_BIND_IP:?}:3128
      no_proxy: ${FACADE_RELAY_BIND_IP:?},facade,localhost,127.0.0.1
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      AMUSANT_DEVICE_TOKEN_FILE: /run/secrets/device_token
      AMUSANT_DEVICE_PSKS_FILE: /run/secrets/device_psks
      AMUSANT_FACADE_API_KEY_FILE: /run/secrets/facade_api_key
    secrets:
      - source: gemini_api_key
        target: gemini_api_key
      - source: device_token
        target: device_token
      - source: device_psks
        target: device_psks
      - source: facade_api_key
        target: facade_api_key
    volumes:
      - relay_state:/var/lib/amusant
    ports:
      - target: 8443
        published: ${RELAY_PUBLISH_PORT:-8443}
        host_ip: ${RELAY_HOST_PRIVATE_IP:?bind only to the OCI private VCN address}
        protocol: tcp
    networks:
      relay_api:
        ipv4_address: ${RELAY_BIND_IP:?}
      relay_egress:
        ipv4_address: ${RELAY_EGRESS_IP:?set the static Relay egress IP}
    depends_on:
      facade:
        condition: service_healthy
      egress_proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "/opt/amusant/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: ${RELAY_CPU_LIMIT:?set a measured Relay CPU ceiling}
          memory: ${RELAY_MEMORY_LIMIT:?set a measured Relay memory ceiling}

  facade:
    image: ${FACADE_IMAGE:?set an immutable ARM64 facade image reference}
    platform: linux/arm64
    user: "10003:10003"
    group_add: ["20000"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: ${FACADE_STOP_GRACE_PERIOD:?set a bounded facade shutdown grace}
    environment:
      AMUSANT_FACADE_BIND_IP: ${FACADE_RELAY_BIND_IP:?set the static facade IP on relay_api}
      AMUSANT_FACADE_WRITER_BIND_IP: ${FACADE_HERMES_BIND_IP:?set the internal writer IP on hermes_api}
      AMUSANT_RESULT_STATE_DIR: /var/lib/amusant-results
      AMUSANT_FACADE_API_KEY_FILE: /run/secrets/facade_api_key
      AMUSANT_HERMES_API_KEY_FILE: /run/secrets/hermes_api_key
      AMUSANT_FACADE_WRITER_API_KEY_FILE: /run/secrets/facade_writer_api_key
    secrets:
      - source: facade_api_key
        target: facade_api_key
      - source: hermes_api_key
        target: hermes_api_key
      - source: facade_writer_api_key
        target: facade_writer_api_key
    volumes:
      - result_state:/var/lib/amusant-results
    networks:
      relay_api:
        ipv4_address: ${FACADE_RELAY_BIND_IP:?}
      hermes_api:
        ipv4_address: ${FACADE_HERMES_BIND_IP:?set the static facade IP on hermes_api}
    depends_on:
      hermes:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://' + os.environ['AMUSANT_FACADE_BIND_IP'] + ':8643/health', timeout=2).read(64)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: ${FACADE_CPU_LIMIT:?set a measured facade CPU ceiling}
          memory: ${FACADE_MEMORY_LIMIT:?set a measured facade memory ceiling}

  hermes:
    image: ${HERMES_IMAGE:?set the tested immutable Hermes ARM64 image digest}
    platform: linux/arm64
    entrypoint: ["python3", "/usr/local/bin/amusant-hermes-entrypoint.py"]
    command: []
    user: "10000:10000"
    group_add: ["20000"]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: ${HERMES_STOP_GRACE_PERIOD:?set a Hermes shutdown grace}
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      AMUSANT_FACADE_WRITER_URL: http://${FACADE_HERMES_BIND_IP:?set the internal writer IP on hermes_api}:8644
      AMUSANT_FACADE_WRITER_API_KEY_FILE: /run/secrets/facade_writer_api_key
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: ${HERMES_API_BIND_IP:?}
      API_SERVER_PORT: "8642"
      API_SERVER_KEY_FILE: /run/secrets/hermes_api_key
      HTTPS_PROXY: http://${EGRESS_PROXY_HERMES_BIND_IP:?set the Hermes-side proxy IP}:3128
      HTTP_PROXY: http://${EGRESS_PROXY_HERMES_BIND_IP:?}:3128
      NO_PROXY: ${HERMES_API_BIND_IP},hermes,localhost,127.0.0.1
      https_proxy: http://${EGRESS_PROXY_HERMES_BIND_IP:?}:3128
      http_proxy: http://${EGRESS_PROXY_HERMES_BIND_IP:?}:3128
      wss_proxy: http://${EGRESS_PROXY_HERMES_BIND_IP:?}:3128
      no_proxy: ${HERMES_API_BIND_IP},hermes,localhost,127.0.0.1
    secrets:
      - source: hermes_api_key
        target: hermes_api_key
      - source: facade_writer_api_key
        target: facade_writer_api_key
    volumes:
      - hermes_home:/opt/data
      - ${HERMES_CONFIG_FILE:?mount the manually reviewed Hermes config}:/opt/data/config.yaml:ro
      - ./hermes_plugin:/opt/data/plugins/amusant-option-d:ro
      - ./hermes_entrypoint.py:/usr/local/bin/amusant-hermes-entrypoint.py:ro
    networks:
      hermes_api:
        ipv4_address: ${HERMES_API_BIND_IP:?}
      hermes_egress:
        ipv4_address: ${HERMES_EGRESS_IP:?set the static Hermes egress IP}
    depends_on:
      egress_proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://' + os.environ['API_SERVER_HOST'] + ':8642/health', timeout=2).read(256)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${HERMES_CPU_LIMIT:?set a measured Hermes CPU ceiling}
          memory: ${HERMES_MEMORY_LIMIT:?set a measured Hermes memory ceiling}

  egress_proxy:
    image: ${EGRESS_PROXY_IMAGE:?set an immutable egress-proxy image reference}
    platform: linux/arm64
    user: "10002:10002"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      EGRESS_PROXY_BIND_IPS: ${EGRESS_PROXY_RELAY_BIND_IP:?},${EGRESS_PROXY_HERMES_BIND_IP:?}
      EGRESS_PROXY_ALLOWED_CLIENTS: ${RELAY_EGRESS_IP:?},${HERMES_EGRESS_IP:?}
    networks:
      relay_egress:
        ipv4_address: ${EGRESS_PROXY_RELAY_BIND_IP:?}
      hermes_egress:
        ipv4_address: ${EGRESS_PROXY_HERMES_BIND_IP:?}
      proxy_outbound: {}
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3129/healthz', timeout=1).read(16)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: ${PROXY_CPU_LIMIT:?set a measured proxy CPU ceiling}
          memory: ${PROXY_MEMORY_LIMIT:?set a proxy memory ceiling}

networks:
  relay_api:
    internal: true
    ipam:
      config:
        - subnet: ${RELAY_API_CIDR:?set an isolated private subnet}
  hermes_api:
    internal: true
    ipam:
      config:
        - subnet: ${HERMES_API_CIDR:?set an isolated private subnet}
  relay_egress:
    internal: true
    ipam:
      config:
        - subnet: ${RELAY_EGRESS_CIDR:?set an isolated private subnet}
  hermes_egress:
    internal: true
    ipam:
      config:
        - subnet: ${HERMES_EGRESS_CIDR:?set an isolated private subnet}
  proxy_outbound: {}

volumes:
  relay_state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OCI_DATA_DIR:?mount and prepare the OCI block volume first}/relay
  hermes_home:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OCI_DATA_DIR:?mount and prepare the OCI block volume first}/hermes
  result_state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OCI_DATA_DIR:?mount and prepare the OCI block volume first}/results/facade

secrets:
  gemini_api_key:
    file: ${GEMINI_API_KEY_FILE:?set an owner-only secret file path}
  device_token:
    file: ${DEVICE_TOKEN_FILE:?set an owner-only secret file path}
  device_psks:
    file: ${DEVICE_PSKS_FILE:?set an owner-only secret file path}
  facade_api_key:
    file: ${FACADE_API_KEY_FILE:?set a root group-readable facade-only key file path}
  hermes_api_key:
    file: ${HERMES_API_KEY_FILE:?set a root group-readable Hermes API key file path}
  facade_writer_api_key:
    file: ${FACADE_WRITER_API_KEY_FILE:?set a distinct writer-only key file path}
