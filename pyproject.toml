[project]
name = "amusant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.111",
    "google-genai>=2.0",
    "websockets>=14,<17",
]

[project.optional-dependencies]
hardware-opus = [
    "av>=14,<17",
    "numpy>=1.26,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.2.4",
]
